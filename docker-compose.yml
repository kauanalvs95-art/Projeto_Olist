services:

  db:
    image: postgres:18.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: "1234"
      POSTGRES_USER: admin
      POSTGRES_DB: database_db
    volumes: 
      - dados:/var/lib/postgresql
    ports:
      - 5432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  dados: 